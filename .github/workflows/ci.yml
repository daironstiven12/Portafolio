name: CI

# Pipeline mínimo, sin build: el sitio es HTML/CSS/JS puro.
# Solo valida seguridad, sintaxis y referencias para que ningún
# cambio rompa la CSP ni suba recursos inseguros a GitHub Pages.
on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    name: Validar seguridad y sintaxis
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20

      - name: Sintaxis de JavaScript
        run: |
          node --check js/main.js
          node --check js/data.js
          node --check js/theme-init.js
          node --check scripts/validate.js

      - name: Validación estática (seguridad + recursos)
        run: node scripts/validate.js
