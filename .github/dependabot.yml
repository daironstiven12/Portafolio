# Dependabot: mantiene actualizados los actions del workflow CI.
# El sitio no tiene dependencias de npm (sin package.json), por lo que no
# hay más ecosistemas que vigilar. Si algún día añades package.json,
# añade también aquí el bloque `package-ecosystem: "npm"`.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - github-actions
    commit-message:
      prefix: ci
      include: scope
